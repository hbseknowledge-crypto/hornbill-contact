<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hornbill Contact</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",sans-serif;background:#f4f7fb;color:#172033}.w{max-width:520px;margin:auto;padding:28px 18px}.c{background:#fff;border-radius:24px;padding:28px 20px;text-align:center;box-shadow:0 10px 35px #17324d14}.logo{width:86px;height:86px;border-radius:50%;margin:auto;background:#17649c;color:#fff;display:grid;place-items:center;font-size:34px;font-weight:800}h1{font-size:25px}.save{display:block;width:100%;border:0;padding:17px;background:#0f6fc6;color:#fff;text-decoration:none;border-radius:16px;font-size:19px;font-weight:800;cursor:pointer}.phone{display:flex;justify-content:space-between;align-items:center;padding:15px;margin:10px 0;border:1px solid #e4e9f0;border-radius:15px;text-decoration:none;color:#172033;text-align:left}.phone small{display:block;color:#7a8494}.phone b{font-size:19px}.closed{padding:18px;background:#fff3cd;border:1px solid #ffe69c;border-radius:14px;margin-top:20px;font-weight:700;color:#664d03}.muted{color:#7a8494;font-size:14px}.loading{padding:24px;color:#7a8494}</style></head><body><main class="w"><section class="c"><div class="logo">นก</div><div id="app" class="loading">กำลังโหลดข้อมูลล่าสุด...</div></section></main><script>const DATA_URL="https://raw.githubusercontent.com/hbseknowledge-crypto/hornbill-contact/main/data/maesai.json";function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function fmt(p){p=String(p||'');return p.length===10?p.slice(0,3)+'-'+p.slice(3,6)+'-'+p.slice(6):p.length===9?p.slice(0,3)+'-'+p.slice(3,6)+'-'+p.slice(6):p}function vcard(d){let a=['BEGIN:VCARD','VERSION:3.0','N:;'+d.name+';;;','FN:'+d.name];(d.phones||[]).forEach(x=>a.push('TEL;TYPE=WORK:'+x.phone));a.push('END:VCARD','');return a.join('\r\n')}function saveContact(d){const blob=new Blob([vcard(d)],{type:'text/vcard;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='contact.vcf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}function render(d){document.title=d.name||'Hornbill Contact';const a=document.getElementById('app');if(!d.enabled){a.className='';a.innerHTML='<h1>'+esc(d.name)+'</h1><div class="closed">ข้อมูลติดต่อนี้ถูกปิดใช้งานชั่วคราว</div><p class="muted">กรุณาติดต่อศูนย์บริการผ่านช่องทางอื่น</p>';return}const phones=(d.phones||[]).map(x=>'<a class="phone" href="tel:'+esc(x.phone)+'"><span><small>'+esc(x.label||'โทรศัพท์')+'</small><b>'+fmt(x.phone)+'</b></span><i>☎️</i></a>').join('');a.className='';a.innerHTML='<h1>'+esc(d.name)+'</h1><button id="saveBtn" class="save">👤 บันทึกเบอร์ติดต่อ</button><p>กดเพื่อเพิ่มลงในรายชื่อ</p>'+phones;document.getElementById('saveBtn').onclick=()=>saveContact(d)}fetch(DATA_URL+'?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(render).catch(e=>{document.getElementById('app').innerHTML='<div class="closed">ไม่สามารถโหลดข้อมูลล่าสุดได้</div><p class="muted">กรุณาลองใหม่อีกครั้ง</p>'})</script></body></html>
