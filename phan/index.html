<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f4c81"><title>ศูนย์นกเงือก พาน</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",sans-serif;background:#f4f7fb;color:#172033}.wrap{max-width:520px;margin:auto;min-height:100vh;padding:28px 18px 40px}.card{background:#fff;border-radius:24px;padding:28px 20px;box-shadow:0 10px 35px #17324d14;text-align:center}.logo{width:86px;height:86px;border-radius:50%;margin:auto;background:linear-gradient(145deg,#0f4c81,#4d82b2);display:grid;place-items:center;color:#fff;font-size:34px;font-weight:800}h1{font-size:25px;margin:18px 0 4px}.sub{color:#687386;margin:0 0 24px}.save{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:16px;padding:17px 18px;background:#0f6fc6;color:#fff;text-decoration:none;font-size:19px;font-weight:750;box-shadow:0 8px 20px #0f6fc62b;cursor:pointer}.save.alt{background:#18a058}.hint{font-size:13px;color:#7a8494;margin:10px 0 24px;line-height:1.5}.phone{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;margin:10px 0;border:1px solid #e4e9f0;border-radius:15px;text-decoration:none;color:#172033;background:#fff}.phone span:first-child{text-align:left}.label{font-size:12px;color:#7a8494;display:block;margin-bottom:2px}.num{font-size:19px;font-weight:700}.call{font-size:22px}.note{margin-top:20px;padding:13px;border-radius:13px;background:#f2f7fc;color:#526173;font-size:13px;line-height:1.55}</style></head><body><main class="wrap"><section class="card"><div class="logo">นก</div><h1>ศูนย์นกเงือก พาน</h1><p class="sub">ข้อมูลติดต่อศูนย์บริการ</p><a id="saveBtn" class="save" href="contact.vcf">👤 บันทึกเบอร์ติดต่อ</a><p id="hint" class="hint">กดครั้งเดียวเพื่อเปิดข้อมูลสำหรับเพิ่มลงในรายชื่อ</p><a class="phone" href="tel:0966931936"><span><small class="label">โทรศัพท์</small><span class="num">096-693-1936</span></span><span class="call">☎️</span></a>
<a class="phone" href="tel:0966938236"><span><small class="label">โทรศัพท์</small><span class="num">096-693-8236</span></span><span class="call">☎️</span></a><div class="note">QR เดียวใช้ได้ทั้ง iPhone และ Android<br>หากเปิดผ่าน LINE บน Android ระบบจะช่วยเปิดเบราว์เซอร์ภายนอกเพื่อให้บันทึกรายชื่อได้</div></section></main><script>(function(){const ua=navigator.userAgent||"";if(/Android/i.test(ua)&&/Line\//i.test(ua)){const b=document.getElementById("saveBtn"),h=document.getElementById("hint");b.textContent="🌐 เปิดเบราว์เซอร์เพื่อบันทึก";b.classList.add("alt");b.removeAttribute("href");h.textContent="LINE บางรุ่นปิดกั้นไฟล์รายชื่อ กดปุ่มนี้เพื่อเปิดหน้าเดิมใน Chrome แล้วกดบันทึกเบอร์ติดต่อ";b.addEventListener("click",function(){const host=location.host,path=location.pathname+(location.search||"");const fallback=encodeURIComponent(location.href);location.href="intent://"+host+path+"#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url="+fallback+";end";});}})();</script></body></html>
