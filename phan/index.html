<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="format-detection" content="telephone=no"><title>Hornbill Contact</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",sans-serif;background:#f4f7fb;color:#172033}.w{max-width:520px;margin:auto;padding:28px 18px}.c{background:#fff;border-radius:24px;padding:28px 20px;text-align:center;box-shadow:0 10px 35px #17324d14}.logo{width:86px;height:86px;border-radius:50%;margin:auto;background:#17649c;color:#fff;display:grid;place-items:center;font-size:34px;font-weight:800}h1{font-size:25px}.save{display:flex;width:100%;border:0;padding:17px;background:#0f6fc6;color:#fff;text-decoration:none;border-radius:16px;font-size:19px;font-weight:800;cursor:pointer;align-items:center;justify-content:center}.phone{display:flex;justify-content:space-between;align-items:center;padding:15px;margin:10px 0;border:1px solid #e4e9f0;border-radius:15px;text-decoration:none;color:#172033;text-align:left}.phone small{display:block;color:#7a8494}.phone b{font-size:19px}.closed{padding:18px;background:#fff3cd;border:1px solid #ffe69c;border-radius:14px;margin-top:20px;font-weight:700;color:#664d03}.muted{color:#7a8494;font-size:14px}.line-hint{display:none;margin:10px 0 0;padding:12px;border-radius:12px;background:#f1f5f9;color:#596579;font-size:13px;line-height:1.5}.line-open{display:none;margin-top:8px}.line-open a{display:inline-block;padding:10px 14px;border-radius:10px;background:#e9eef5;color:#172033;text-decoration:none;font-weight:700}.ver{margin-top:14px;color:#a0a8b4;font-size:10px}</style></head><body><main class="w"><section class="c"><div class="logo">นก</div><div id="app">กำลังโหลดข้อมูลล่าสุด...</div><div class="ver">Public Contact v1.1.9</div></section></main><script>const DATA_URL="../data/phan.json",VCF_URL="contact.vcf";function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function fmt(p){p=String(p||'');return p.length===10?p.slice(0,3)+'-'+p.slice(3,6)+'-'+p.slice(6):p.length===9?p.slice(0,3)+'-'+p.slice(3,6)+'-'+p.slice(6):p}function isLine(){return /Line\//i.test(navigator.userAgent||'')}function browserUrl(){var u=location.href.replace(/#.*$/,'');var ua=navigator.userAgent||'';if(/Android/i.test(ua)){return 'intent://'+location.host+location.pathname+location.search+'#Intent;scheme=https;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;S.browser_fallback_url='+encodeURIComponent(u)+';end'}return u}function render(d){document.title=d.name||'Hornbill Contact';const a=document.getElementById('app');if(!d.enabled){a.innerHTML='<h1>'+esc(d.name)+'</h1><div class="closed">ข้อมูลติดต่อนี้ถูกปิดใช้งานชั่วคราว</div><p class="muted">กรุณาติดต่อศูนย์บริการผ่านช่องทางอื่น</p>';return}const phones=(d.phones||[]).map(x=>'<a class="phone" href="tel:'+esc(x.phone)+'"><span><small>'+esc(x.label||'โทรศัพท์')+'</small><b>'+fmt(x.phone)+'</b></span><i>☎️</i></a>').join('');a.innerHTML='<h1>'+esc(d.name)+'</h1><a id="saveBtn" class="save" href="'+VCF_URL+'" target="_blank" rel="noopener">👤 บันทึกเบอร์ติดต่อ</a><p>กดเพื่อเพิ่มลงในรายชื่อ</p><div id="lineHint" class="line-hint">กำลังเปิดจาก LINE หากปุ่มบันทึกเบอร์ติดต่อไม่ทำงาน กรุณากด “เปิดด้วยเบราว์เซอร์” ด้านล่าง แล้วแตะบันทึกเบอร์ติดต่ออีกครั้ง</div><div id="lineOpen" class="line-open"></div>'+phones; if(isLine()){document.getElementById('lineHint').style.display='block';document.getElementById('lineOpen').innerHTML='<a href="'+esc(browserUrl())+'">🌐 เปิดด้วยเบราว์เซอร์ของเครื่อง</a>';document.getElementById('lineOpen').style.display='block'}}fetch(DATA_URL+'?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status+' ('+DATA_URL+')');return r.json()}).then(d=>{if(!d||!Array.isArray(d.phones)||typeof d.enabled!=='boolean'||!d.name)throw Error('รูปแบบข้อมูลสาขาไม่ถูกต้อง');render(d)}).catch(e=>{const a=document.getElementById('app');a.innerHTML='<div class="closed">ไม่สามารถโหลดข้อมูลล่าสุดได้</div><p class="muted">'+esc(e.message||'การเชื่อมต่อขัดข้อง')+'</p><button class="save" type="button" onclick="location.reload()">ลองใหม่</button>'})</script></body></html>
